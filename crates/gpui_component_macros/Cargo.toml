# Modified for Spork IDE: vendored from gpui-component-macros 0.9.1 (crates.io).
[package]
name = "gpui_component_macros"
version = "0.9.1"
description = "Procedural macros for GPUI Component, the styled layer of GPUI Kit."
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
edition.workspace = true
publish.workspace = true

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"
style = { level = "allow", priority = -1 }

[lints.rust]
# the code still has the left-out features' cfgs
unexpected_cfgs = "allow"

[lib]
path = "src/gpui_component_macros.rs"
proc-macro = true

[dependencies]
proc-macro2.workspace = true
proc-macro-crate = "3.5"
quote.workspace = true
syn = "2.0"
