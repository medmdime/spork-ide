# Modified for Spork IDE: vendored from gpui-kit 0.9.1 (crates.io), built against this fork's GPUI
# instead of gpui-pre; the gpui-fast, speech and tree-sitter features are left out (see gpui_component).
[package]
name = "gpui_kit"
version = "0.9.1"
description = "GPUI Kit: one dependency for building desktop applications with GPUI, GPUI Base, GPUI Component and default assets."
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
edition.workspace = true
publish.workspace = true

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"
style = { level = "allow", priority = -1 }

[lints.rust]
# the code still has the left-out features' cfgs
unexpected_cfgs = "allow"

[lib]
path = "src/gpui_kit.rs"

[features]
default = ["component", "assets"]
# The styled component library, `gpui_kit::component`. Initializes `gpui-base` too.
component = ["dep:gpui_component"]
# The default icon set for `gpui-component`, `gpui_kit::assets`.
assets = ["dep:gpui_kit_assets"]
# GPUI's test harness, native-platform rendering, and Kit UI test helpers.
test-support = ["gpui/test-support", "gpui_platform/test-support", "gpui_base/test-support", "gpui_component?/test-support"]
# Frame-event instrumentation remains opt-in for performance builds.
profiler = ["gpui/profiler"]
inspector = ["gpui/inspector", "gpui_base/inspector", "gpui_component?/inspector"]
decimal = ["component", "gpui_component/decimal"]
# Lighter syntax highlighting: about 200 languages from syntect for a few
# megabytes, with no syntax tree.
syntect = ["component", "gpui_component/syntect"]

[dependencies]
gpui_macros.workspace = true
# gpui-pre's default features but font-kit (empty) and windows-manifest (gpui_platform's on
# Windows): linked into the IDE, gpui keeps the IDE's features
gpui = { workspace = true, features = ["wayland", "x11"] }
gpui_base.workspace = true
gpui_component = { workspace = true, optional = true }
gpui_kit_assets = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# no runtime_shaders: the shaders are compiled at build time, as the IDE's are
gpui_platform = { workspace = true, features = ["font-kit", "x11", "wayland"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true

[dev-dependencies]
chrono = "0.4.38"
gpui = { workspace = true, features = ["test-support"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }

[[test]]
name = "ui"
required-features = ["test-support", "component"]

[[test]]
name = "rendering"
# Requires Metal (macOS) or WGPU (Linux); select explicitly with --test rendering.
test = false
harness = false
required-features = ["test-support", "component", "assets"]

[[test]]
name = "native_shutdown"
# Uses the native event loop and a hidden window; requires a desktop session.
# Run explicitly with `cargo test -p gpui_kit --test native_shutdown`.
test = false
harness = false
