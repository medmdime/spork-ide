<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Spork's app icon: a spork whose handle branches like a git history. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8BF5"/>
      <stop offset="1" stop-color="#7A3FE0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <!-- the head: three tines over a spoon's bowl, centered on x = 512 -->
  <path fill="#FFFFFF" d="M390 212 a30 30 0 0 1 60 0 V346 h32 V212 a30 30 0 0 1 60 0 V346 h32 V212 a30 30 0 0 1 60 0 V408 a122 122 0 0 1 -244 0 Z"/>
  <!-- the handle, a branch joining it, and their commits -->
  <rect x="482" y="490" width="60" height="300" rx="30" fill="#FFFFFF"/>
  <path d="M676 618 C676 708 512 690 512 760" fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
  <circle cx="676" cy="604" r="50" fill="#FFFFFF"/>
  <circle cx="512" cy="806" r="54" fill="#FFFFFF"/>
</svg>
