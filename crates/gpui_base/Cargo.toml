# Modified for Spork IDE: vendored from gpui-base 0.9.1 (crates.io), built against this fork's GPUI
# instead of gpui-pre, without the gpui-fast feature.
[package]
name = "gpui_base"
version = "0.9.1"
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
edition.workspace = true
publish.workspace = true

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"
style = { level = "allow", priority = -1 }

[lints.rust]
# the code still has the left-out features' cfgs
unexpected_cfgs = "allow"

[lib]
path = "src/gpui_base.rs"
doctest = false

[[bench]]
name = "motion"
harness = false

[[bench]]
name = "text_view_scroll"
harness = false

[features]
decimal = ["dep:rust_decimal"]
test-support = ["gpui/test-support"]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow.workspace = true
aho-corasick.workspace = true
chrono = "0.4.38"
data-url = "0.3"
futures.workspace = true
gpui.workspace = true
gpui_macros.workspace = true
instant = { version = "0.1", features = ["wasm-bindgen"] }
itertools = "0.13.0"
lsp-types = { version = "0.97.0", features = ["proposed"] }
markdown = { version = "1.0.0", features = ["serde"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3.0"
num-traits = "0.2"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
regex = "1"
rust_decimal = { version = "1.37.0", optional = true }
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smallvec.workspace = true
sum_tree.workspace = true
tracing.workspace = true
unicode-linebreak = "0.1.5"
unicode-segmentation.workspace = true
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSAccessibility", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The reduced-motion preference (SystemParametersInfoW).
windows = { version = "0.58.0", features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The reduced-motion preference, through the XDG desktop portal's Settings interface.
ashpd = { workspace = true, features = ["async-io", "settings"] }

[dev-dependencies]
criterion.workspace = true
# the unit tests use `crate::test_support`
gpui_base = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support", "bench-support"] }
gpui_platform = { workspace = true, features = ["font-kit", "x11", "wayland", "bench-support"] }
indoc.workspace = true
reqwest_client.workspace = true
