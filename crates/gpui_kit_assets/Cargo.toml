# Modified for Spork IDE: vendored from gpui-kit-assets 0.9.1 (crates.io), built against this fork's
# GPUI instead of gpui-pre, without the gpui-fast feature.
[package]
name = "gpui_kit_assets"
version = "0.9.1"
description = "Default bundled assets for GPUI Kit."
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
edition.workspace = true
publish.workspace = true
# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"
style = { level = "allow", priority = -1 }

[lints.rust]
# the code still has the left-out features' cfgs
unexpected_cfgs = "allow"

[lib]
path = "src/gpui_kit_assets.rs"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
log.workspace = true

[dev-dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "x11", "wayland"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { workspace = true, features = ["charset", "multipart"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
