[package]
name = "spork_e2e"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/spork_e2e.rs"
doctest = false

[dependencies]
editor.workspace = true
gpui.workspace = true
gpui_base.workspace = true
gpui_kit.workspace = true
log.workspace = true
lsp.workspace = true
project.workspace = true
serde_json.workspace = true
settings.workspace = true
smol.workspace = true
spork_git.workspace = true
spork_code.workspace = true
spork_coverage.workspace = true
spork_editor.workspace = true
spork_http.workspace = true
spork_java.workspace = true
spork_kotlin.workspace = true
spork_run.workspace = true
spork_settings.workspace = true
spork_tool_windows.workspace = true
spork_vcs.workspace = true
spork_workbench.workspace = true
terminal_view.workspace = true
theme.workspace = true
theme_settings.workspace = true
util.workspace = true
workspace.workspace = true

# the end-to-end tests read the accessibility tree from inside the app; GPUI builds it already
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSGeometry", "NSString"] }
