# Modified for Spork IDE: vendored from gpui-component 0.9.1 (crates.io), built against this fork's
# GPUI instead of gpui-pre. Left out: gpui-fast (a second GPUI), speech (its cpal 0.15 next to this
# workspace's patched cpal) and the tree-sitter highlighter (its crates.io tree-sitter would link the
# native library twice beside this workspace's); syntect still highlights.
[package]
name = "gpui_component"
version = "0.9.1"
description = "GPUI Component: the styled component library of GPUI Kit, with 60+ desktop UI components for GPUI."
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
edition.workspace = true
publish.workspace = true

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"
style = { level = "allow", priority = -1 }

[lints.rust]
# the code still has the left-out features' cfgs
unexpected_cfgs = "allow"

[lib]
path = "src/gpui_component.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "gpui_base/test-support"]
decimal = ["gpui_base/decimal"]
inspector = ["gpui_macros/inspector", "gpui/inspector", "gpui_base/inspector"]
# Syntax highlighting for Markdown, Input and Diff from syntect and bat's
# syntax collection: about 200 languages for a few megabytes. Regex-based and
# line-oriented, so it has no syntax tree: no structural folding and no
# syntax-aware editing.
syntect = ["dep:syntect", "dep:two-face"]

[dependencies]
unicode-width.workspace = true
unicode-segmentation.workspace = true
similar = { workspace = true, features = ["unicode"] }
regex = "1"
anyhow.workspace = true
gpui.workspace = true
gpui_macros.workspace = true
gpui_base.workspace = true
gpui_component_macros.workspace = true
gpui_kit_assets.workspace = true
notify = "8.2.0"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
rust-i18n = "4.2.0"
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_repr = "0.1"
smallvec.workspace = true
sum_tree.workspace = true
tracing.workspace = true
log.workspace = true
markdown = { version = "1.0.0", features = ["serde"] }
enum-iterator = "2.1.0"
itertools = "0.13.0"
once_cell = "1.19.0"
paste = "1"
uuid.workspace = true
# Chart
num-traits = "0.2"
# Calendar
chrono = "0.4.38"
# Code Editor
lsp-types = { version = "0.97.0", features = ["proposed"] }
# The `syntect` highlighter, portable to WASM.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"], optional = true }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"], optional = true }
# Cross-platform time APIs (zero-cost on native, uses web APIs on WASM)
instant = { version = "0.1", features = ["wasm-bindgen"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
# Native menu (NativeMenu) — drives AppKit NSMenu via objc2.
raw-window-handle.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSMenu", "NSMenuItem", "NSView", "NSWindow", "NSResponder", "NSEvent", "NSImage"] }
objc2-foundation = { workspace = true, features = ["NSData", "NSString", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Native menu (NativeMenu) — drives Win32 popup menus.
raw-window-handle.workspace = true
resvg = "0.45.1"
windows = { version = "0.58.0", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# the unit tests use gpui_base's test support, which this crate's test-support completes
gpui_component = { workspace = true, features = ["test-support"] }
indoc.workspace = true

[package.metadata.cargo-machete]
ignored = ["gpui_macros"]
