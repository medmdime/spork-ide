# the scenarios' Gradle daemons stop a minute after their last build, not three hours
org.gradle.daemon.idletimeout=60000
# Kotlin compiles in Gradle's daemon, which leaves no Kotlin daemon running after a scenario
kotlin.compiler.execution.strategy=in-process
# Kotlin's plugin would warn on each build that Gradle 8.10.2 is old
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
